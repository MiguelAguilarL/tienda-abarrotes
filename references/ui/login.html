<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="web_blank" name="shell-type">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary-container": "#6d28d9", "secondary-fixed-dim": "#68dba9", "on-secondary": "#ffffff", "on-tertiary-fixed": "#2f1500", "on-secondary-fixed-variant": "#005137", "outline-variant": "#ccc3d7", "on-secondary-container": "#00714e", "error": "#ba1a1a", "surface-container": "#eaedff", "on-surface": "#131b2e", "surface-container-highest": "#dae2fd", "on-primary": "#ffffff", "secondary": "#006c4a", "surface-container-low": "#f2f3ff", "surface-variant": "#dae2fd", "on-error-container": "#93000a", "secondary-container": "#82f5c1", "inverse-primary": "#d3bbff", "on-tertiary-container": "#ffc394", "surface-container-lowest": "#ffffff", "inverse-surface": "#283044", "surface-container-high": "#e2e7ff", "on-background": "#131b2e", "on-tertiary": "#ffffff", "on-primary-fixed": "#250059", "primary-fixed": "#ebddff", "on-secondary-fixed": "#002114", "surface-dim": "#d2d9f4", "primary-fixed-dim": "#d3bbff", "on-tertiary-fixed-variant": "#6e3900", "tertiary": "#653400", "tertiary-container": "#884800", "background": "#faf8ff", "primary": "#5300b7", "surface-tint": "#7331df", "on-error": "#ffffff", "tertiary-fixed": "#ffdcc3", "secondary-fixed": "#85f8c4", "tertiary-fixed-dim": "#ffb77d", "on-primary-container": "#dac5ff", "surface-bright": "#faf8ff", "inverse-on-surface": "#eef0ff", "on-primary-fixed-variant": "#5b00c5", "surface": "#faf8ff", "on-surface-variant": "#4a4455", "error-container": "#ffdad6", "outline": "#7b7486" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1.25rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "space-md": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "gutter-mobile": "0.75rem", "space-sm": "0.5rem", "margin": "1.5rem" }, "fontFamily": { "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "code-num": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"] }, "fontSize": { "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "code-num": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } }</script>
</head>

<body
    class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">
    <header class="w-full py-space-lg flex justify-center items-center">
        <div class="flex items-center gap-space-sm">
            <div
                class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
                <span class="material-symbols-outlined text-on-primary text-[20px]">storefront</span></div><span
                class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight">TiendaAbarrotes</span>
        </div>
    </header>
    <main class="w-full flex-1 flex flex-col items-center justify-center px-gutter-mobile md:px-gutter">
        <div class="flex flex-col w-full items-center justify-center py-space-md sm:py-space-xl relative">
            <!-- Subtle decorative ambient glows contained in screen scope -->
            <div
                class="absolute -top-12 -left-12 w-72 h-72 rounded-full bg-primary-fixed/25 blur-3xl pointer-events-none">
            </div>
            <div
                class="absolute -bottom-10 -right-10 w-80 h-80 rounded-full bg-surface-container/60 blur-3xl pointer-events-none">
            </div>
            <!-- Main Login Card Container -->
            <div
                class="relative w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_12px_36px_-6px_rgba(19,27,46,0.06),0_4px_16px_-2px_rgba(19,27,46,0.03)] p-8 sm:p-10 transition-all duration-300">
                <!-- Top Decorative Brand Pill & Quick Terminal Indicator -->
                <div class="flex items-center justify-between mb-space-lg">

                    <div class="flex items-center gap-1 text-on-surface-variant font-code-num text-body-sm">


                    </div>
                </div>
                <!-- Header Section -->
                <div class="text-left mb-space-xl">
                    <div
                        class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center mb-space-md shadow-sm">
                        <span class="material-symbols-outlined text-primary text-[26px]">storefront</span>
                    </div>
                    <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold">
                        Iniciar Sesión
                    </h1>
                    <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                        Sistema de Gestión de Tienda
                    </p>
                </div>
                <!-- Form -->
                <form class="space-y-space-md" id="pos-login-form" onsubmit="event.preventDefault(); simulateLogin();">
                    <!-- Input: Empleado o ID -->
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between">
                            <label class="font-label-lg text-label-lg text-on-surface" for="employee-id">
                                Nombre de Empleado o ID
                            </label>

                        </div>
                        <div class="relative flex items-center">
                            <div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">badge</span>
                            </div>
                            <input autocomplete="username"
                                class="w-full h-11 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container focus:ring-offset-1 focus:ring-offset-surface-container-lowest bg-surface-container-low/40"
                                id="employee-id" name="employee-id" placeholder="Ej. EMP-104 o Carlos López" required=""
                                type="text">
                        </div>
                    </div>
                    <!-- Input: Password -->
                    <div class="space-y-1.5 pt-1">
                        <div class="flex items-center justify-between">
                            <label class="font-label-lg text-label-lg text-on-surface" for="employee-password">
                                Contraseña
                            </label>

                        </div>
                        <div class="relative flex items-center">
                            <div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-[20px]">lock</span>
                            </div>
                            <input autocomplete="current-password"
                                class="w-full h-11 pl-11 pr-11 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg shadow-sm outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container focus:ring-offset-1 focus:ring-offset-surface-container-lowest bg-surface-container-low/40"
                                id="employee-password" name="employee-password" placeholder="••••••••" required=""
                                type="password">
                            <button aria-label="Ver u ocultar contraseña"
                                class="absolute right-3.5 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none"
                                id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
                                <span class="material-symbols-outlined text-[20px]" id="toggle-icon">visibility</span>
                            </button>
                        </div>
                    </div>
                    <!-- Extra Options Row -->
                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 cursor-pointer select-none group">
                            <input
                                class="w-4 h-4 rounded text-primary-container bg-surface-container-low focus:ring-primary-container focus:ring-offset-1 transition-colors cursor-pointer accent-primary-container"
                                id="remember-session" name="remember-session" type="checkbox">
                            <span
                                class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
                                Recordar sesión
                            </span>
                        </label>

                    </div>
                    <!-- Submit Action Button -->
                    <div class="pt-space-sm">
                        <button
                            class="w-full h-12 bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2 group cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                            id="btn-login-submit" type="submit">
                            <span id="btn-text">Ingresar</span>
                            <span
                                class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:translate-x-1"
                                id="btn-icon">arrow_forward</span>
                        </button>
                    </div>
                </form>
                <!-- Quick Shift Info Divider -->
                <div
                    class="mt-space-lg pt-space-md border-t-0 bg-surface-container-low/60 rounded-lg p-3 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">

                        <div class="flex flex-col">


                        </div>
                    </div>
                    <span
                        class="font-code-num text-body-sm text-on-surface-variant px-2 py-1 bg-surface-container-lowest rounded">v
                        0.1</span>
                </div>
            </div>
            <!-- Operational Footer Support Note -->
            <div class="mt-space-md text-center max-w-[420px] px-space-sm">
                <p
                    class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-1.5 leading-relaxed">
                    <span class="material-symbols-outlined text-[16px] text-tertiary">contact_support</span>
                    Para soporte o reactivación de cuenta, contacta al administrador de turno.
                </p>
            </div>
        </div>
        <script>
            function togglePasswordVisibility() {
                const passwordInput = document.getElementById('employee-password');
                const toggleIcon = document.getElementById('toggle-icon');
                if (!passwordInput || !toggleIcon) return;

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.textContent = 'visibility';
                }
            }

            function simulateLogin() {
                const btn = document.getElementById('btn-login-submit');
                const text = document.getElementById('btn-text');
                const icon = document.getElementById('btn-icon');
                if (!btn || !text || !icon) return;

                btn.disabled = true;
                btn.classList.add('opacity-80', 'cursor-not-allowed');
                text.textContent = 'Verificando credenciales...';
                icon.textContent = 'sync';
                icon.classList.add('animate-spin');

                setTimeout(() => {
                    text.textContent = 'Acceso concedido';
                    icon.classList.remove('animate-spin');
                    icon.textContent = 'check_circle';
                    btn.classList.remove('bg-primary-container', 'hover:bg-primary');
                    btn.classList.add('bg-secondary');

                    setTimeout(() => {
                        text.textContent = 'Ingresar';
                        icon.textContent = 'arrow_forward';
                        btn.disabled = false;
                        btn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-secondary');
                        btn.classList.add('bg-primary-container', 'hover:bg-primary');
                    }, 1500);
                }, 1000);
            }
        </script>
    </main>
    <footer class="w-full py-space-lg text-center">
        <div
            class="flex flex-col sm:flex-row items-center justify-center gap-space-xs sm:gap-space-md font-body-sm text-body-sm text-on-surface-variant">
            <p>©&nbsp; Sistema de Gestión de Tienda. Hecho por Miguel Aguilar.</p>
            <div class="flex items-center gap-space-sm"></div>
        </div>
    </footer>

</body>

</html>
